<style>
:root{
  --paper:#F7F1E8; --card:#FFFCF7; --ink:#2B1E19; --muted:#7A6A5E; --line:rgba(43,30,25,.12);
  --forest:#888C70; --forest-2:#9CA088; --forest-ink:#5E6248; --plum:#5B2A45; --plum-2:#7A3D5E; --plum-soft:#EADCE2;
  --forest-soft:#E8E9DE; --cognac:#9A5B2E; --mustard:#C39A2E; --rust:#9E4426;
  --good:#4E6B3A; --warn:#B07A1E; --bad:#9A2E2E;
  --serif:'Bodoni Moda', Didot, 'Bodoni 72', 'Times New Roman', serif;
  --script:'Pinyon Script', 'Snell Roundhand', cursive;
  --sans:'Jost', -apple-system, system-ui, sans-serif;
  --r:18px; --nav:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 12px);min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
img{display:block;max-width:100%}
a{color:var(--plum)}
#view{max-width:720px;margin:0 auto;padding:0 16px}
.mast{padding:22px 0 10px}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0}
h1{font-size:38px;line-height:1.02;letter-spacing:-.01em}
.mast h1{font-family:var(--script);font-weight:400;font-size:50px;line-height:1.08;letter-spacing:0;color:var(--forest);padding:4px 0 2px}
.mast h1 em{font-style:normal;color:var(--forest)}
h1 em,h2 em{font-style:italic;color:var(--plum)}
h2{font-size:26px;line-height:1.1;margin:26px 0 10px}
h3{font-size:19px;margin:0 0 6px}
p{margin:.4em 0}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card.plum{background:var(--plum);color:#F6ECF0;border:none}
.card.plum .kicker{color:#D9BFCB}
.card.forest{background:var(--forest);color:#fff;border:none}
.card.forest .kicker{color:#F1F2EA}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:600px){.grid3{grid-template-columns:repeat(4,1fr)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--ink);background:transparent;border-radius:999px;padding:11px 18px;font-weight:500;font-size:15px;cursor:pointer;min-height:44px}
.btn.primary{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.forest{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:7px 13px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.plum.on{background:var(--plum);border-color:var(--plum)}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--forest-soft);color:var(--forest-ink);font-weight:500}
.tag.plum{background:var(--plum-soft);color:var(--plum)}
.tag.warn{background:#F3E6C8;color:#7A5410}
.tag.bad{background:#F1D9D6;color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);vertical-align:middle}
.lvl-good{color:var(--good)} .lvl-ok{color:var(--warn)} .lvl-bad{color:var(--bad)}
/* items */
.item{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;aspect-ratio:3/4;padding:8px;cursor:pointer;overflow:hidden}
.item img{width:100%;height:100%;object-fit:contain}
.item .badge{position:absolute;top:6px;left:6px}
.item .cdot{position:absolute;top:8px;right:8px}
.item .nm{position:absolute;left:0;right:0;bottom:0;font-size:11px;padding:4px 8px;background:linear-gradient(transparent,rgba(255,252,247,.95));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* collage */
.collage{display:grid;grid-template-columns:1.25fr 1fr;gap:6px;background:var(--card);border-radius:14px;padding:10px;aspect-ratio:1/1}
.collage .l,.collage .r{display:flex;flex-direction:column;gap:6px;min-height:0}
.collage .cell{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.collage img{max-height:100%;max-width:100%;object-fit:contain}
.score{font-family:var(--serif);font-size:44px;line-height:1;font-style:italic}
.score small{font-size:18px;font-style:normal;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--forest)}
.note{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.note:first-child{border-top:none}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:rgba(247,241,232,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex}
nav.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5}
nav.tabs button.on{color:var(--plum)}
nav.tabs button.center .ring{width:48px;height:48px;border-radius:50%;background:var(--plum);display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 6px 18px rgba(91,42,69,.35)}
nav.tabs button.center svg{stroke:#fff}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);z-index:25;width:58px;height:58px;border-radius:50%;background:var(--forest);color:#fff;border:none;font-size:30px;box-shadow:0 8px 22px rgba(47,75,58,.4);cursor:pointer}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(43,30,25,.38);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;border-radius:22px 22px 0 0;overflow:auto;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease-out;-webkit-overflow-scrolling:touch}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 8px}
.sheet .x{position:sticky;top:0;float:right;border:none;background:var(--card);border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;z-index:2;border:1px solid var(--line)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:999px;z-index:80;font-size:14px;max-width:90vw;text-align:center;animation:fade .2s}
/* forms */
label.f{display:block;margin:12px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
textarea.in{min-height:90px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--plum)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.seg button.on{background:var(--forest);border-color:var(--forest);color:#fff}
/* studio */
.studio-row{position:relative;margin:6px -16px}
.studio-row .lbl{position:absolute;left:16px;top:4px;z-index:2;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.studio-row .lock{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(255,252,247,.92);cursor:pointer;display:flex;align-items:center;justify-content:center}
.studio-row .lock.on{background:var(--plum);border-color:var(--plum);color:#fff}
.studio-row .lock svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - var(--w)/2)}
.track::-webkit-scrollbar{display:none}
.slide{flex:none;width:var(--w);height:var(--hgt);scroll-snap-align:center;display:flex;align-items:center;justify-content:center;opacity:.35;transition:opacity .2s, transform .2s;transform:scale(.86)}
.slide.cur{opacity:1;transform:none}
.slide img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(43,30,25,.14))}
.slide .none{width:70%;height:70%;border:1.5px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.studio-bar{position:sticky;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 6px);z-index:5;background:var(--card);border:1px solid var(--line);border-radius:999px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 16px;margin-top:10px;box-shadow:0 8px 22px rgba(43,30,25,.10)}
.studio-bar .sc{font-family:var(--serif);font-style:italic;font-size:26px;min-width:52px;cursor:pointer}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.iconbtn.plum{background:var(--plum);border-color:var(--plum);color:#fff}
/* misc */
.list-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list-item:first-child{border-top:none}
.list-item .th{width:64px;height:80px;flex:none;background:var(--card);border-radius:10px;border:1px solid var(--line);padding:4px}
.list-item .th img{width:100%;height:100%;object-fit:contain}
.menu-tile{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;min-height:104px}
.menu-tile .t{font-family:var(--serif);font-size:20px}
.masonry{columns:2;column-gap:10px}
.masonry>*{break-inside:avoid;margin-bottom:10px;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--card)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dh{font-size:11px;color:var(--muted);letter-spacing:.1em;padding:4px 0}
.cal .d{aspect-ratio:1/1.15;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;font-size:13px;cursor:pointer;position:relative;overflow:hidden}
.cal .d.today{border-color:var(--plum);border-width:2px}
.cal .d.out{opacity:.3}
.cal .d .mk{width:6px;height:6px;border-radius:50%;background:var(--forest);margin-top:3px}
.cal .d .mk.worn{background:var(--plum)}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.prog>i{display:block;height:100%;background:var(--plum);transition:width .3s}
.spin{width:28px;height:28px;border:2.5px solid var(--line);border-top-color:var(--plum);border-radius:50%;animation:rot .8s linear infinite;margin:18px auto}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty .big{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink);margin-bottom:6px}
.swatch-row{display:flex;gap:4px;flex-wrap:wrap}
.swatch-row span{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.1)}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--forest)}
.pastebox{border:1.5px dashed var(--plum);border-radius:14px;padding:18px;text-align:center;color:var(--plum);min-height:60px;outline:none}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.hide{display:none!important}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs" id="tabs">

// ---------- Farbmathematik ----------
const hexToRgb = hex => { const n = parseInt((hex || '#888888').replace('#', '').padEnd(6, '0').slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgbToHex = ([r, g, b]) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
function rgbToLab([r, g, b]) {
  const f = c => { c /= 255; return c > 0.04045 ? Math.pow((c + 0.055) / 1.055, 2.4) : c / 12.92; };
  const R = f(r), G = f(g), B = f(b);
  let x = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047, y = R * 0.2126 + G * 0.7152 + B * 0.0722, z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
  const g3 = t => t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
  x = g3(x); y = g3(y); z = g3(z);
  return [116 * y - 16, 500 * (x - y), 200 * (y - z)];
}
const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const labOf = hex => rgbToLab(hexToRgb(hex));
const ALL_PAL = [...PAL_GOOD.map(p => [...p, 'good']), ...PAL_OK.map(p => [...p, 'ok']), ...PAL_BAD.map(p => [...p, 'bad'])].map(([n, h, l]) => ({ n, h, l, lab: labOf(h) }));

function colorInfo(hex) {
  const lab = labOf(hex); const [L, a, b] = lab;
  const chroma = Math.hypot(a, b); let hue = Math.atan2(b, a) * 180 / Math.PI; if (hue < 0) hue += 360;
  let best = null, bd = 1e9;
  for (const p of ALL_PAL) { const d = dE(lab, p.lab); if (d < bd) { bd = d; best = p; } }
  let level = best.l;
  if (bd > 28) { // Heuristik für Farben außerhalb der Liste
    if (L > 78 && chroma > 12 && chroma < 45) level = 'bad';         // Pastell
    else if (chroma > 70 && L > 55) level = 'bad';                     // Neon / knallig
    else if (L < 60 && chroma < 55 && (hue < 110 || hue > 300)) level = 'good'; // warm & gedeckt
    else level = 'ok';
  }
  const denim = hue > 230 && hue < 290 && chroma > 8 && chroma < 40 && L > 20 && L < 65;
  const neutral = chroma < 14 || (hue >= 25 && hue <= 95 && chroma < 42 && L < 82) || (L > 85 && chroma < 22) || denim;
  return { lab, L, chroma, hue, name: best.n, level, neutral, dist: bd };
}

  return 'Steht laut deiner Farbanalyse auf der Meiden-Liste – macht dich blass. Höchstens weit weg vom Gesicht (Hose, Schuhe).';
}

// ---------- IndexedDB ----------
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('armoire', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        const keys = { items: 'id', outfits: 'id', plans: 'date', trips: 'id', kv: 'k', inspo: 'id' };
        for (const [s, k] of Object.entries(keys)) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: k });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const q = fn(tx.objectStore(store));
      tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  all(s) { return this._req(s, 'readonly', o => o.getAll()); },
  put(s, v) { return this._req(s, 'readwrite', o => o.put(v)); },
  del(s, k) { return this._req(s, 'readwrite', o => o.delete(k)); },
  clear(s) { return this._req(s, 'readwrite', o => o.clear()); },
};

async function migrateOccasions(kv) {
  if (kv.some(x => x.k === 'occVersion' && x.v >= 2)) return;
  const one = o => (OCC_MIGRATE[o] || [o])[0];
  for (const it of S.items) {
    if (!it.occasions?.length) continue;
    const next = [...new Set(it.occasions.flatMap(o => o === 'restaurant' ? OCC_MIGRATE.restaurant_old : (OCC_MIGRATE[o] || [o])))].filter(o => OCCM[o]);
    if (next.join() !== it.occasions.join()) { it.occasions = next; await DB.put('items', it); }
  }
  for (const o of S.outfits) if (o.occasion && OCC_MIGRATE[o.occasion]) { o.occasion = one(o.occasion); await DB.put('outfits', o); }
  for (const p of Object.values(S.plans)) if (p.occasion && OCC_MIGRATE[p.occasion]) { p.occasion = one(p.occasion); await DB.put('plans', p); }
  for (const t of S.trips) {
    let ch = false;
    for (const e of t.plan || []) if (OCC_MIGRATE[e.occasion]) { e.occasion = one(e.occasion); ch = true; }
    if (t.ev && 'pilates' in t.ev) { t.ev.sport = t.ev.pilates; delete t.ev.pilates; ch = true; }
    if (ch) await DB.put('trips', t);
  }
  if (S.settings.profile) {
    const np = S.settings.profile.replace(/^Anlässe:.*$/m, OCC_LINE);
    if (np !== S.settings.profile) { S.settings.profile = np; await DB.put('kv', { k: 'settings', v: S.settings }); }
  }
  await DB.put('kv', { k: 'occVersion', v: 2 });
}

function newItemBase(extra = {}) {

function applyAI(it, t) {
  if (!t) return it;
  if (CAT[t.cat]) it.cat = t.cat;
  if (it.cat === 'sport' && SLOT_IDS.includes(t.sportSlot)) it.sportSlot = t.sportSlot;
  if (t.name) it.name = t.name;
  if (t.colorName) it.colorName = t.colorName;
  if (!it.img && /^#[0-9a-f]{6}$/i.test(t.colorHex || '')) it.color = t.colorHex;
  if (PATTERNS.includes(t.pattern)) it.pattern = t.pattern;
  if (t.formality) it.formality = clamp(Math.round(t.formality), 1, 5);
  if (t.warmth) it.warmth = clamp(Math.round(t.warmth), 1, 5);
  if (Array.isArray(t.seasons) && t.seasons.length) it.seasons = t.seasons.filter(s => s === 'fs' || s === 'hw');
  if (Array.isArray(t.occasions)) it.occasions = t.occasions.filter(o => OCCM[o]);
  if (t.brand) it.brand = t.brand;
  return it;
}
async function processFiles(files, { wish = false, preCut = false } = {}) {

  const st = () => $('#st', sh.el), pg = () => $('#pg', sh.el), sub = () => $('#sub', sh.el);
  const out = [];

    st().textContent = `Stelle frei: ${i + 1} von ${files.length}`; pg().style.width = (i / files.length * 80) + '%';
    let cut = null, err = null;
    try {
      if (preCut || await isTransparent(files[i])) cut = (await trimTransparent(files[i])).blob;
      else cut = await removeBg(files[i], p => { sub().textContent = `Modell wird geladen … ${Math.round(p * 100)}%`; });
    } catch (e) { err = e; console.warn(e); cut = await resizeBlob(files[i], 900, 'image/jpeg', 0.9); }
    sub().textContent = err ? 'Ein Bild konnte nicht freigestellt werden – Original übernommen.' : '';
    const it = newItemBase({ wish, img: cut, color: await dominantColor(cut) });
    it.colorName = colorInfo(it.color).name; out.push(it);
  }
  if (S.settings.apiKey) {
    st().textContent = 'Die KI erkennt Kategorie, Stil & Saison …'; pg().style.width = '88%';
    for (let i = 0; i < out.length; i += 6) {
      const chunk = out.slice(i, i + 6);
      try {
        const parts = []; for (const [k, it] of chunk.entries()) { parts.push({ text: `Bild ${k}:` }); parts.push(await imgPart(it.img, 448)); }
        parts.push({ text: `Beschreibe jedes Kleidungsstück. Gib ein Array mit genau ${chunk.length} Einträgen zurück, idx = Bildnummer.\n${ITEM_RULES}` });
        const res = await gemini({ parts, temperature: 0.2, schema: { type: 'ARRAY', items: { type: 'OBJECT', properties: { idx: { type: 'INTEGER' }, ...ITEM_FIELDS }, required: ['idx', 'cat', 'name'] } } });
        for (const t of res || []) if (chunk[t.idx]) applyAI(chunk[t.idx], t);
      } catch (e) { sub().textContent = e.message + ' – du kannst die Angaben selbst ausfüllen.'; if (e.code === 'NO_KEY') break; await sleep(1200); }
    }
  }
  pg().style.width = '100%';
  reviewSheet(sh, out);

    ${tv.length ? `<p class="muted">${Math.round(Math.min(...tv.map(x => x.min)))}° bis ${Math.round(Math.max(...tv.map(x => x.max)))}° · ${items.length} Teile für ${t.plan.filter(p => p.itemIds.length).length} Looks</p>` : ''}
    <h3 style="margin-top:14px">Looks</h3>
    ${t.plan.map(p => { const its = p.itemIds.map(itemById).filter(Boolean); const tm = t.temps?.[p.date]; return `<div class="card"><div class="row"><b>${WDAYS[parseISO(p.date).getDay()].slice(0, 2)} ${fmtShort(parseISO(p.date))} · ${p.slot}</b><div class="spacer"></div><span class="small muted">${OCCM[p.occasion]?.name || ''}${tm ? ' · ' + wmo(tm.code)[1] + ' ' + Math.round(tm.max) + '°' : ''}</span></div>${its.length ? `<div style="max-width:260px;margin-top:8px">${collage(its)}</div>` : '<p class="small muted">Dafür fehlen passende Teile.</p>'}</div>`; }).join('')}
    <h3 style="margin-top:14px">Packliste</h3>
    <div id="pl">${Object.entries(grp).map(([c, arr]) => `<div class="kicker" style="margin-top:10px">${CAT[c].name}</div>${arr.map(i => `<label class="check"><input type="checkbox" data-k="${i.id}" ${t.checked.includes(i.id) ? 'checked' : ''}><img src="${imgURL(i)}" style="width:36px;height:44px;object-fit:contain"><span>${esc(i.name || '')}</span></label>`).join('')}`).join('')}
    <div class="kicker" style="margin-top:10px">Außerdem</div>${t.extras.map(x => `<label class="check"><input type="checkbox" data-k="${esc(x)}" ${t.checked.includes(x) ? 'checked' : ''}><span>${esc(x)}</span></label>`).join('')}</div>
    <hr><button class="btn ghost block" id="delT" style="color:var(--bad)">Reise löschen</button>`);
  $('#pl', sh.el).onchange = async e => { const k = e.target.dataset.k; if (!k) return; t.checked = e.target.checked ? [...new Set([...t.checked, k])] : t.checked.filter(x => x !== k); await DB.put('trips', t); };
  $('#delT', sh.el).onclick = async () => { if (await confirmSheet('Reise löschen?', 'Löschen', true)) { S.trips = S.trips.filter(x => x.id !== t.id); await DB.del('trips', t.id); sh.close(); go('reisen'); } };
}

// ---------- Statistik ----------
routes.statistik = () => {
  const v = view(); v.onclick = null; const all = closet();
  const worn = all.filter(i => (i.wears || []).length); const value = all.reduce((s, i) => s + (i.price || 0), 0);
  const top = [...all].sort((a, b) => (b.wears || []).length - (a.wears || []).length).slice(0, 5);
  const cpw = all.filter(i => i.price).map(i => ({ i, c: i.price / Math.max(1, (i.wears || []).length) })).sort((a, b) => b.c - a.c).slice(0, 6);
  const lv = { good: 0, ok: 0, bad: 0 }; all.forEach(i => lv[i._c.level]++);
  const maxCat = Math.max(1, ...CATS.map(c => all.filter(i => i.cat === c.id).length));
  v.innerHTML = `<header class="mast"><div class="kicker">In Zahlen</div><h1>By the <em>Numbers</em></h1></header>
    <div class="grid2">
      <div class="card" style="margin:0"><div class="kicker">Teile</div><div class="score">${all.length}</div></div>
      <div class="card" style="margin:0"><div class="kicker">Schrankwert</div><div class="score" style="font-size:30px">${value ? eur(value) : '–'}</div></div>
      <div class="card" style="margin:0"><div class="kicker">Schon getragen</div><div class="score">${all.length ? Math.round(worn.length / all.length * 100) : 0}<small>%</small></div></div>
      <div class="card" style="margin:0"><div class="kicker">Deep Autumn</div><div class="score">${all.length ? Math.round(lv.good / all.length * 100) : 0}<small>%</small></div></div>
    </div>
    <div class="card"><div class="kicker">Farbtyp-Check</div><div class="bar" style="height:14px;display:flex;margin-top:8px"><i style="width:${all.length ? lv.good / all.length * 100 : 0}%;background:var(--good)"></i><i style="width:${all.length ? lv.ok / all.length * 100 : 0}%;background:var(--mustard)"></i><i style="width:${all.length ? lv.bad / all.length * 100 : 0}%;background:var(--bad)"></i></div>
      <div class="small" style="margin-top:6px"><span class="lvl-good">✓ ${lv.good} steht dir</span> · <span class="lvl-ok">◐ ${lv.ok} geht</span> · <span class="lvl-bad">✕ ${lv.bad} eher nicht</span></div>
      <div class="swatch-row" style="margin-top:10px">${all.map(i => `<span style="background:${i.color}"></span>`).join('')}</div></div>
    <div class="card"><div class="kicker">Kategorien</div>${CATS.map(c => { const n = all.filter(i => i.cat === c.id).length; return `<div class="row small" style="margin-top:6px"><span style="width:150px">${c.name}</span><div class="bar" style="flex:1"><i style="width:${n / maxCat * 100}%"></i></div><span style="width:28px;text-align:right">${n}</span></div>`; }).join('')}</div>
    <h2>Meist <em>getragen</em></h2>${top.filter(i => (i.wears || []).length).map(i => `<div class="list-item" data-id="${i.id}"><div class="th"><img src="${imgURL(i)}"></div><div style="flex:1"><b>${esc(i.name || '')}</b><div class="small muted">${(i.wears || []).length}× getragen</div></div></div>`).join('') || '<p class="muted">Markiere Outfits als getragen – dann füllt sich das hier.</p>'}
    <h2>Teuer pro <em>Tragen</em></h2>${cpw.map(({ i, c }) => `<div class="list-item" data-id="${i.id}"><div class="th"><img src="${imgURL(i)}"></div><div style="flex:1"><b>${esc(i.name || '')}</b><div class="small muted">${eur(i.price)} · ${(i.wears || []).length}× getragen</div></div><b>${eur(c)}</b></div>`).join('') || '<p class="muted">Trage Preise bei deinen Teilen ein.</p>'}`;
  v.onclick = e => { const c = e.target.closest('[data-id]'); if (c) itemSheet(c.dataset.id, () => go('statistik')); };
};

// ---------- Einstellungen ----------
function citySheet(after) {
  const sh = openSheet(`<h3>Deine Stadt</h3><input class="in" id="cq" placeholder="Stadt suchen"><div id="cr"></div><button class="btn block" id="geo" style="margin-top:10px">Aktuellen Standort verwenden</button>`, { onClose: after });
  let tmr = null;
  $('#cq', sh.el).oninput = e => { clearTimeout(tmr); const q = e.target.value.trim(); if (q.length < 2) return; tmr = setTimeout(async () => { const r = await geocode(q).catch(() => []); $('#cr', sh.el).innerHTML = r.map((c, i) => `<div class="list-item" data-c="${i}"><div><b>${esc(c.name)}</b> <span class="small muted">${esc(c.region)}</span></div></div>`).join(''); $('#cr', sh.el).onclick = async ev => { const b = ev.target.closest('[data-c]'); if (!b) return; S.settings.city = r[+b.dataset.c]; S.weather = null; await kvSave('settings', S.settings); sh.close(); }; }, 350); };
  $('#geo', sh.el).onclick = () => navigator.geolocation.getCurrentPosition(async p => { S.settings.city = { name: 'Mein Standort', lat: +p.coords.latitude.toFixed(3), lon: +p.coords.longitude.toFixed(3) }; S.weather = null; await kvSave('settings', S.settings); sh.close(); }, () => toast('Standort nicht verfügbar.'));
}
routes.settings = async () => {
  const v = view(); v.onclick = null;
  let persisted = false; try { persisted = await navigator.storage?.persisted?.(); } catch (e) { }
  let est = null; try { est = await navigator.storage?.estimate?.(); } catch (e) { }
  v.innerHTML = `<header class="mast"><div class="kicker">Einstellungen</div><h1>Set<em>tings</em></h1></header>
    <div class="card"><h3>KI (Google Gemini – gratis)</h3>
      <p class="small muted">1. Öffne <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> und melde dich mit Google an. 2. „API-Schlüssel erstellen“. 3. Hier einfügen. Der Schlüssel bleibt nur auf diesem iPhone. Hinweis: In der Gratis-Stufe darf Google die gesendeten Bilder zur Verbesserung nutzen; es gibt ein Tageslimit.</p>
      <label class="f">API-Schlüssel</label><input class="in" id="key" type="password" autocomplete="off" value="${esc(S.settings.apiKey)}" placeholder="AIza…">
      <label class="f">Modell</label><input class="in" id="model" value="${esc(S.settings.model)}">
      <div class="row" style="margin-top:10px"><button class="btn primary small" id="saveKey">Speichern</button><button class="btn small" id="testKey">Testen</button><span class="small" id="kres"></span></div></div>
    <div class="card"><h3>Stadt fürs Wetter</h3><p>${S.settings.city ? esc(S.settings.city.name) : '<span class="muted">nicht gesetzt</span>'}</p><button class="btn small" id="city">Ändern</button></div>
    <div class="card"><h3>Mein Stilprofil</h3><p class="small muted">Danach richtet sich die KI-Bewertung. Ändere es, wenn sich dein Stil weiterentwickelt.</p><textarea class="in" id="prof" style="min-height:200px">${esc(S.settings.profile)}</textarea><button class="btn small" id="saveProf" style="margin-top:8px">Profil speichern</button></div>
    <div class="card"><h3>Backup</h3><p class="small muted">Alles liegt nur in diesem Browser. Mach regelmäßig ein Backup (z. B. in iCloud Drive), damit nichts verloren geht. ${est ? `Belegt: ${(est.usage / 1048576).toFixed(1)} MB.` : ''} ${persisted ? '✓ Dauerhafter Speicher aktiv.' : ''}</p>
      <div class="row wrap"><button class="btn small" id="exp">Backup exportieren</button><button class="btn small" id="imp">Backup importieren</button></div></div>
    <div class="card"><h3>Pinterest</h3><p class="small muted">Dein Board wird über GitHub Actions automatisch alle 6 Stunden abgeholt. ${S.pins?.updated ? 'Zuletzt: ' + esc(S.pins.updated.slice(0, 16).replace('T', ' ')) : ''}</p></div>
    <div class="card"><h3>Abgelehnte Kombis</h3><p class="small muted">${S.rejected.length} Kombinationen werden nicht mehr vorgeschlagen.</p><button class="btn small" id="clrRej">Zurücksetzen</button></div>
    <button class="btn ghost block" id="wipe" style="color:var(--bad);margin:10px 0 30px">Alle Daten löschen</button>`;
  $('#saveKey').onclick = async () => { S.settings.apiKey = $('#key').value.trim(); S.settings.model = $('#model').value.trim() || 'gemini-flash-latest'; await kvSave('settings', S.settings); toast('Gespeichert.'); };
  $('#testKey').onclick = async () => { $('#saveKey').click(); $('#kres').textContent = '…'; try { const t = await gemini({ parts: [{ text: 'Antworte nur mit: Bonjour!' }], temperature: 0 }); $('#kres').textContent = '✓ ' + t.trim().slice(0, 30); } catch (e) { $('#kres').textContent = '✕ ' + e.message; } };
  $('#city').onclick = () => citySheet(() => go('settings'));
  $('#saveProf').onclick = async () => { S.settings.profile = $('#prof').value; await kvSave('settings', S.settings); toast('Profil gespeichert.'); };
  $('#clrRej').onclick = async () => { S.rejected = []; await kvSave('rejected', []); toast('Zurückgesetzt.'); go('settings'); };
  $('#exp').onclick = exportBackup; $('#imp').onclick = importBackup;
  $('#wipe').onclick = async () => {
    if (!await confirmSheet('Wirklich ALLE Teile, Looks und Einstellungen löschen? Das kann nicht rückgängig gemacht werden.', 'Alles löschen', true)) return;
    for (const s of ['items', 'outfits', 'plans', 'trips', 'kv', 'inspo']) await DB.clear(s);
    location.reload();
  };
};
async function exportBackup() {
  toast('Backup wird erstellt …');
  const items = []; for (const it of S.items) { const o = stripPrivate(it); if (o.img instanceof Blob) o.img = await blobToDataURL(o.img); items.push(o); }
  const inspo = []; for (const x of S.inspo) inspo.push({ ...x, img: await blobToDataURL(x.img) });
  const data = { app: 'armoire', version: 1, date: new Date().toISOString(), items, outfits: S.outfits, plans: Object.values(S.plans), trips: S.trips, inspo, kv: { settings: { ...S.settings, apiKey: '' }, styleDNA: S.styleDNA, rejected: S.rejected } };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' }); const name = `armoire-backup-${iso()}.json`;
  const file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Armoire Backup' }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function importBackup() {
  const inp = $('#fileJson'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text()); if (d.app !== 'armoire') throw new Error('Keine Armoire-Datei.');
      if (!await confirmSheet(`Backup vom ${d.date?.slice(0, 10)} mit ${d.items.length} Teilen importieren? Vorhandene Teile mit gleicher ID werden überschrieben.`, 'Importieren')) return;
      for (const it of d.items) { if (typeof it.img === 'string' && it.img.startsWith('data:')) it.img = await dataURLToBlob(it.img); await DB.put('items', it); }
      for (const x of d.inspo || []) { x.img = await dataURLToBlob(x.img); await DB.put('inspo', x); }
      for (const o of d.outfits || []) await DB.put('outfits', o);
      for (const p of d.plans || []) await DB.put('plans', p);
      for (const t of d.trips || []) await DB.put('trips', t);
      const key = S.settings.apiKey;
      if (d.kv?.settings) await kvSave('settings', { ...d.kv.settings, apiKey: key || d.kv.settings.apiKey || '' });
      if (d.kv?.styleDNA) await kvSave('styleDNA', d.kv.styleDNA);
      if (d.kv?.rejected) await kvSave('rejected', d.kv.rejected);
      toast('Import fertig.'); setTimeout(() => location.reload(), 800);
    } catch (e) { toast('Import fehlgeschlagen: ' + e.message); }
  };
  inp.click();
}

// ---------- Start ----------
(async () => {
  try { await loadAll(); } catch (e) { view().innerHTML = `<div class="card">Speicher nicht verfügbar: ${esc(e.message)}. Bitte nicht im privaten Modus öffnen.</div>`; return; }
  try { if (navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) { }
  loadPins();
  const start = (location.hash || '').slice(1);
  go(routes[start] ? start : 'heute');
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (routes[h] && h !== current) go(h); });
})();
window.__armoire = { S, saveItem, newItemBase, colorInfo, evaluate, suggest, countOutfitsWith, go, planTrip, geocode, deleteItem };
