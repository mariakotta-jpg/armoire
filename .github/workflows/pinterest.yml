name: Pinterest-Pins abrufen

on:
  schedule:
    - cron: "17 */6 * * *"   # alle 6 Stunden
  workflow_dispatch:          # manuell: Actions → "Run workflow"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pins laden
        env:
          BOARDS: "maria280703/outfits"   # weitere Boards mit Komma: nutzer/board2
        run: python3 .github/scripts/fetch_pins.py
      - name: Änderungen speichern
        run: |
          git config user.name "pinterest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pins
          git diff --cached --quiet || (git commit -m "Pinterest-Pins aktualisiert" && git push)
